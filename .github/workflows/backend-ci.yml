name: Backend CI (Pytest)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx  # 确保有测试依赖
        
    - name: Run Pytest
      run: |
        python -m pytest tests/ -v

    # Deterministic eval: real agent code against recorded outputs, stub judge.
    # No API key needed. The live LLM-judge run is manual: python -m src.evals.run --live
    - name: Agent eval harness (mock)
      run: python -m src.evals.run --report-dir eval_reports

    - name: Upload eval report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-eval-report
        path: server/eval_reports/
