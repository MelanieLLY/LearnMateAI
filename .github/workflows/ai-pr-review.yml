name: AI PR Review (Anthropic API)

on:
  pull_request:
    branches: [ "main" ]
    types: [ "opened", "synchronize", "reopened", "ready_for_review" ]

# Read the code, write one PR comment. Nothing else.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI-Powered Code Review via Claude API
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit-test the review script
        run: node --test .github/scripts/ai-pr-review.test.mjs

      # Secrets are not passed to workflows triggered from forks, so the key is empty there.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not available (fork PR or unset secret). Skipping AI review."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR diff
        id: diff
        if: steps.key.outputs.enabled == 'true'
        run: |
          BASE="origin/${{ github.base_ref }}"
          EXCLUDES=(':(exclude)**/package-lock.json' ':(exclude)**/*.png' ':(exclude)**/*.pdf')
          git diff "$BASE"...HEAD -- . "${EXCLUDES[@]}" > pr.diff
          git diff --name-only "$BASE"...HEAD > changed_files.txt
          echo "diff_size=$(wc -c < pr.diff | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Install Anthropic SDK
        if: steps.key.outputs.enabled == 'true' && steps.diff.outputs.diff_size != '0'
        run: npm install --no-save --no-package-lock --prefix .github/scripts @anthropic-ai/sdk@0.131.0

      - name: Run AI review and post comment
        if: steps.key.outputs.enabled == 'true' && steps.diff.outputs.diff_size != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Set the repository variable AI_REVIEW_MODEL to change models without editing this file.
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
        run: node .github/scripts/ai-pr-review.mjs
